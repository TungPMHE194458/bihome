spring:
  application:
    name: bihome
  jackson:
    time-zone: Asia/Ho_Chi_Minh
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  datasource:
    hikari:
      # Sắp xếp theo thứ tự chữ cái tiếng Việt (mặc định BINARY xếp "Ô tô" sau "Xe máy"); chỉ ảnh hưởng ORDER BY.
      connection-init-sql: ALTER SESSION SET NLS_SORT = VIETNAMESE
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: Asia/Ho_Chi_Minh
  flyway:
    enabled: true
    locations: classpath:db/migration
  mvc:
    format:
      date: iso
      date-time: iso
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

bihome:
  jwt:
    secret: ${BIHOME_JWT_SECRET}
    access-ttl: 15m
    refresh-ttl: 7d
    session-refresh-ttl: 1d
    cookie-secure: true
  auth:
    log-otp: false
  storage:
    root: ./storage
    public-base-url: /api/v1/files
  cors:
    allowed-origins: http://localhost:5173
  # Webhook biến động số dư: secret bắt buộc (trống = từ chối mọi yêu cầu); giả lập chỉ bật ở local / test.
  bank-webhook:
    secret: ${BIHOME_BANK_WEBHOOK_SECRET:}
    simulation-enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
