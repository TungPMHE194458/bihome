# nginx CỦA MÁY CHỦ (/etc/nginx/conf.d/bihome.bitrust.vn.conf): tên miền → container bihome-web (127.0.0.1:18300).
# HTTPS: sau khi DNS trỏ về server, chạy  sudo certbot --nginx -d bihome.bitrust.vn  (certbot tự thêm khối 443).
server {
    listen 80;
    listen [::]:80;
    server_name bihome.bitrust.vn;
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:18300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
